<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaPro Pools | Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1572331130797-3dfd7ebd4b58?w=1600&q=80'); background-size: cover; background-position: center; padding: 2rem 0; }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
</head>
<body>

  <!-- Top Utilities -->
  <div class="position-absolute top-0 end-0 p-4 d-flex gap-3" style="z-index: 1050;">
    <a href="#" id="theme-toggle" class="text-white text-decoration-none fs-5"><i class="fas fa-moon"></i></a>
    <a href="#" id="rtl-toggle" class="text-white text-decoration-none fs-5" aria-label="Toggle RTL"><i class="fas fa-right-left"></i></a>
  </div>

  <div class="container reveal">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-6">
        <div class="premium-card p-4 p-md-5">
          <div class="text-center mb-4">
            <a class="brand-logo" href="index.html">
              <img src="assets/images/branding/driveready-logo.svg" alt="AquaPro Pools Logo" class="logo-light">
              <img src="assets/images/branding/driveready-logo-dark.svg" alt="AquaPro Pools Logo" class="logo-dark">
            </a>
            <p class="text-muted mt-2">Create your account to schedule site visits and track your pool services.</p>
          </div>
          
          <form id="registerForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label fw-bold">First Name</label>
              <input type="text" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Last Name</label>
              <input type="text" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Email Address</label>
              <input type="email" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input type="password" class="form-control form-control-lg" id="password" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Confirm Password</label>
              <input type="password" class="form-control form-control-lg" id="confirmPassword" required>
              <div class="invalid-feedback">Passwords do not match.</div>
            </div>
            
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms" required>
              <label class="form-check-label text-muted small" for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
            </div>
            
            <button type="submit" class="btn-primary-brand w-100 justify-content-center mb-3">Create Account</button>
            
            <div class="text-center text-muted mb-3 small">OR SIGN UP WITH</div>
            
            <div class="d-flex gap-3 mb-4">
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Sign up with Google">
                <i class="fab fa-google"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Sign up with Apple">
                <i class="fab fa-apple"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Sign up with Facebook">
                <i class="fab fa-facebook-f"></i>
              </button>
            </div>
            
            <p class="text-center mb-0 text-muted small">Already have an account? <a href="login.html" class="fw-bold">Login</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      'use strict'
      var forms = document.querySelectorAll('#registerForm')
      Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          const pass = document.getElementById('password').value;
          const confirmPass = document.getElementById('confirmPassword');
          
          if (pass !== confirmPass.value) {
            confirmPass.setCustomValidity("Passwords do not match");
          } else {
            confirmPass.setCustomValidity("");
          }

          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          } else {
            window.location.href = "index.html";
            event.preventDefault();
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
  <script src="js/main.js"></script>
</body>
</html>
