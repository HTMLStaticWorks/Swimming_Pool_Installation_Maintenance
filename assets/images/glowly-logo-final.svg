<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="350" height="100" role="img" aria-label="HydroWave Pools logo">
  <title>HydroWave Pools</title>
  <defs>
    <!-- Wave color gradient -->
    <linearGradient id="waveGradPool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 10)">
    <g transform="scale(1.15)">
      <!-- Left Handrail -->
      <path d="M 22 55 L 22 25 A 9 9 0 0 1 40 25 L 40 55" fill="none" stroke="var(--text-main, #0f1e29)" stroke-width="4.5" stroke-linecap="round" />
      <!-- Right Handrail -->
      <path d="M 36 55 L 36 25 A 9 9 0 0 1 54 25 L 54 55" fill="none" stroke="var(--text-main, #0f1e29)" stroke-width="4.5" stroke-linecap="round" />

      <!-- Wave 2 (Lower Wave) -->
      <path d="M 12 58 Q 38 42 62 58" fill="none" stroke="var(--color-accent, #0ea5e9)" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
      
      <!-- Wave 1 (Upper Cyan Wave) -->
      <path d="M 10 50 Q 38 32 66 50" fill="none" stroke="url(#waveGradPool)" stroke-width="5.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Wordmark -->
  <text x="110" y="55" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1" fill="var(--text-main, #0f1e29)">HydroWave</text>
  <text x="110" y="78" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="var(--color-sage, #14b8a6)" text-transform="uppercase">Pools</text>
</svg>