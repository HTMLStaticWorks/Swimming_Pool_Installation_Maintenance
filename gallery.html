<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaPro Pools | Showcase &amp; Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    /* Specific Gallery Styles */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 1rem;
      cursor: pointer;
    }
    .gallery-item img {
      transition: transform 0.5s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.1);
    }
    .gallery-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
</head>
<body>

  <div id="global-header"></div>

  <main>
    <!-- Section 1: Hero -->
    <section class="section-padding position-relative text-center d-flex align-items-center reveal" style="min-height: 40vh; background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=1600&q=80'); background-size: cover; background-position: center;">
      <div class="container position-relative z-1 py-5">
        <h1 class="display-4 fw-bold text-white mb-3">Our Pool Portfolio</h1>
        <p class="lead text-white-50 mx-auto" style="max-width: 600px;">Take a visual tour of our custom concrete installations, infinity edges, and backyard designs.</p>
      </div>
    </section>

    <!-- Section 2: Filters -->
    <section class="py-5" style="background-color: var(--bg-color);">
      <div class="container text-center reveal">
        <div class="d-flex justify-content-center flex-wrap gap-2">
          <button class="btn btn-primary-brand active px-4">All</button>
          <button class="btn btn-outline-secondary px-4">Geometric Pools</button>
          <button class="btn btn-outline-secondary px-4">Freeform Pools</button>
          <button class="btn btn-outline-secondary px-4">Infinity Edges</button>
          <button class="btn btn-outline-secondary px-4">Spas &amp; Features</button>
        </div>
      </div>
    </section>

    <!-- Section 3: Masonry Grid -->
    <section class="section-padding bg-surface pt-0">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=600&q=80" alt="Geometric pool" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1572331130797-3dfd7ebd4b58?w=600&q=80" alt="Infinity edge" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1560742125-1e35fa8f01c8?w=600&q=80" alt="Freeform pool" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?w=600&q=80" alt="Family splash pool" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1595155708815-5e6b12f4581f?w=600&q=80" alt="Clear balanced pool" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 reveal">
            <div class="gallery-item shadow-sm">
              <img src="https://images.unsplash.com/photo-1507652313519-d4e9174996dd?w=600&q=80" alt="Spa and hot tub design" class="img-fluid w-100" style="height: 300px; object-fit: cover;">
              <div class="gallery-overlay">
                <i class="fas fa-search-plus text-white fa-2x"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 4: Highlights Video (Static Demo) -->
    <section class="section-padding" style="background-color: var(--primary);">
      <div class="container text-center reveal">
        <h2 class="text-white mb-5">Experience the Build</h2>
        <div class="position-relative d-inline-block mx-auto rounded-4 overflow-hidden shadow-lg border border-secondary border-4" style="max-width: 800px;">
          <img src="https://images.unsplash.com/photo-1572331130797-3dfd7ebd4b58?w=800&q=80" class="img-fluid w-100" style="opacity: 0.7;" alt="Build showcase">
          <div class="position-absolute top-50 start-50 translate-middle">
            <button class="btn btn-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
              <i class="fas fa-play fa-2x text-white ms-1"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 5: CTA -->
    <section class="section-padding text-center bg-surface border-top reveal">
      <div class="container">
        <h2 class="mb-4">Visualize your pool here?</h2>
        <p class="text-muted mb-4 mx-auto" style="max-width: 600px;">Let us transform your backyard. Consult with our expert pool designers today.</p>
        <a href="booking.html" class="btn-primary-brand btn-lg">Book Site Visit</a>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
