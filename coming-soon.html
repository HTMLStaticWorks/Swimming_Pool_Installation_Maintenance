<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaPro Pools | Coming Soon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    body { height: 100vh; display: flex; flex-direction: column; background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=1600&q=80'); background-size: cover; background-position: center; }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
</head>
<body>

  <div id="global-header"></div>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center">
    <div class="container reveal">
      <a href="index.html" class="text-decoration-none text-white fs-1 fw-bold d-inline-flex align-items-center gap-2 mb-5">
        <i class="fas fa-water text-secondary"></i> AquaPro Pools
      </a>
      <h1 class="display-3 fw-bold text-white mb-4">New Pool Designs Coming Soon</h1>
      <p class="lead text-white-50 mx-auto mb-5" style="max-width: 600px;">We are preparing our new catalog of luxury pool models. Enter your email below to get notified of our release.</p>
      
      <!-- Countdown -->
      <div class="d-flex justify-content-center gap-2 gap-md-4 mb-5 text-white">
        <div class="bg-primary bg-opacity-75 rounded-4 p-3 shadow-lg border border-secondary" style="min-width: 80px;">
          <h2 class="mb-0 fw-bold">14</h2>
          <small class="text-uppercase tracking-wider">Days</small>
        </div>
        <div class="bg-primary bg-opacity-75 rounded-4 p-3 shadow-lg border border-secondary" style="min-width: 80px;">
          <h2 class="mb-0 fw-bold">08</h2>
          <small class="text-uppercase tracking-wider">Hours</small>
        </div>
        <div class="bg-primary bg-opacity-75 rounded-4 p-3 shadow-lg border border-secondary" style="min-width: 80px;">
          <h2 class="mb-0 fw-bold">45</h2>
          <small class="text-uppercase tracking-wider">Mins</small>
        </div>
      </div>
      
      <div class="mx-auto" style="max-width: 500px;">
        <div class="input-group mb-4">
          <input type="email" class="form-control form-control-lg" placeholder="Enter your email address">
          <button class="btn btn-secondary btn-lg" type="button">Notify Me</button>
        </div>
        <div class="d-flex gap-3 justify-content-center">
          <a href="#" class="text-white opacity-75 fs-4"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="text-white opacity-75 fs-4"><i class="fab fa-twitter"></i></a>
          <a href="#" class="text-white opacity-75 fs-4"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </div>
  </main>

  <div id="global-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
