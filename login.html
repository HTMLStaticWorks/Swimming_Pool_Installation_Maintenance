<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaVista | Login</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/aquavista-logo.png">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="description" content="Log in to your AquaVista account to manage site surveys, design blueprints, and weekly service plans.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-body">

  <div class="auth-tools">
    <button class="icon-btn theme-toggle" aria-label="Toggle Theme">
      <i class="ph ph-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" aria-label="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
  </div>

  <div class="auth-card">

    <a href="index.html" class="auth-logo"><img src="assets/images/aquavista-logo.png" alt="AquaVista" style="height: var(--logo-height, 58px); width: auto; display: block;"></a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to manage your site surveys, blueprints, and weekly service plans.</p>

    <div class="form-success-msg" id="successMsg" role="status">
      <i class="ph ph-check-circle"></i>
      <span>Login successful. Redirecting…</span>
    </div>

    <form id="loginForm" class="auth-form" novalidate>

      <div class="form-group" id="groupEmail">
        <label class="form-label auth-label" for="email">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="" autocomplete="email">
        <div class="error-message">Please enter a valid email address.</div>
      </div>

      <div class="form-group" id="groupPassword">
        <label class="form-label auth-label" for="password">Password</label>
        <div class="field-with-toggle">
          <input type="password" id="password" class="form-control" placeholder="" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">
            <i class="ph ph-eye"></i>
          </button>
        </div>
        <div class="error-message">Password must be at least 8 characters.</div>
      </div>

      <div class="auth-row">
        <label class="check-inline">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="contact.html" class="auth-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-auth">Login to account</button>
    </form>

    <div class="divider">or</div>

    <button class="social-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
        <path fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
      </svg>
      Continue with Google
    </button>

    <button class="social-btn" type="button">
      <i class="ph-fill ph-apple-logo"></i>
      Continue with Apple
    </button>

    <div class="auth-links">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const successMsg = document.getElementById('successMsg');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        let isValid = true;

        // Reset styles
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('invalid'));
        document.querySelectorAll('.form-control').forEach(c => {
          c.classList.remove('form-error');
          c.classList.remove('form-success');
        });

        // Email Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailInput.value.trim())) {
          document.getElementById('groupEmail').classList.add('invalid');
          emailInput.classList.add('form-error');
          isValid = false;
        } else {
          emailInput.classList.add('form-success');
        }

        // Password Validation
        if (passwordInput.value.length < 8) {
          document.getElementById('groupPassword').classList.add('invalid');
          passwordInput.classList.add('form-error');
          isValid = false;
        } else {
          passwordInput.classList.add('form-success');
        }

        if (isValid) {
          successMsg.classList.add('show');
          setTimeout(() => {
            // window.location.href = 'index.html'; // Usually redirect
          }, 1500);
        }
      });

      // Clear errors on input
      [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
          input.closest('.form-group').classList.remove('invalid');
          input.classList.remove('form-error');
        });
      });
    });
  </script>
</body>

</html>
