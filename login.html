<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaPro Pools | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    body { height: 100vh; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=1600&q=80'); background-size: cover; background-position: center; }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/favicon.svg">
</head>
<body>

  <!-- Top Utilities -->
  <div class="position-absolute top-0 end-0 p-4 d-flex gap-3" style="z-index: 1050;">
    <a href="#" id="theme-toggle" class="text-white text-decoration-none fs-5"><i class="fas fa-moon"></i></a>
    <a href="#" id="rtl-toggle" class="text-white text-decoration-none fs-5" aria-label="Toggle RTL"><i class="fas fa-right-left"></i></a>
  </div>

  <div class="container reveal">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="premium-card p-4 p-md-5">
          <div class="text-center mb-4">
            <a class="brand-logo" href="index.html">
              <img src="assets/images/branding/driveready-logo.svg" alt="AquaPro Pools Logo" class="logo-light">
              <img src="assets/images/branding/driveready-logo-dark.svg" alt="AquaPro Pools Logo" class="logo-dark">
            </a>
            <p class="text-muted mt-2">Welcome back! Please login to your pool account.</p>
          </div>
          
          <form id="loginForm" class="needs-validation" novalidate action="index.html">
            <div class="mb-3">
              <label class="form-label fw-bold">Email Address</label>
              <input type="email" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <div class="input-group">
                <input type="password" class="form-control form-control-lg" id="passwordInput" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-primary small fw-bold">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-primary-brand w-100 justify-content-center mb-3">Login</button>
            
            <div class="text-center text-muted mb-3 small">OR LOGIN WITH</div>
            
            <div class="d-flex gap-3 mb-4">
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Login with Google">
                <i class="fab fa-google"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Login with Apple">
                <i class="fab fa-apple"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center fs-5 py-2" aria-label="Login with Facebook">
                <i class="fab fa-facebook-f"></i>
              </button>
            </div>
            
            <p class="text-center mb-0 text-muted small">Don't have an account? <a href="register.html" class="fw-bold">Sign up</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('togglePassword').addEventListener('click', function (e) {
      const password = document.getElementById('passwordInput');
      const icon = this.querySelector('i');
      if (password.type === 'password') {
        password.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        password.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Form Validation (Redirects to dashboard directly in demo)
    (function () {
      'use strict'
      var forms = document.querySelectorAll('#loginForm')
      Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          } else {
            // successful login demo
            window.location.href = "index.html";
            event.preventDefault();
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
  <script src="js/main.js"></script>
</body>
</html>
